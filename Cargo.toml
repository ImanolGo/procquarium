[package]
name = "procquarium"
version = "0.3.2"
edition = "2024"
rust-version = "1.95"
description = "Your running processes, as fish."
license = "MIT"
authors = ["ImanolGo <ImanolGo@users.noreply.github.com>"]
repository = "https://github.com/ImanolGo/procquarium"
readme = "README.md"
keywords = ["tui", "process", "monitor", "aquarium", "ratatui"]
categories = ["command-line-utilities"]
# Keep the 4.4 MB demo out of the published crate.
exclude = ["demo.gif", ".github/"]

[package.metadata.wix]
upgrade-guid = "C334D739-80F0-4A11-A962-75E2CFD24FD5"
path-guid = "5A302ABC-B235-4459-8171-1F3F0A21DE12"
license = false
eula = false

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.39"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.9"
rand_chacha = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[dev-dependencies]
insta = "1"

[profile.release]
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Metadata for `cargo deb` (the .deb attached to each release).
[package.metadata.deb]
maintainer = "ImanolGo <ImanolGo@users.noreply.github.com>"
copyright = "2026, ImanolGo"
license-file = ["LICENSE", "4"]
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = "A terminal aquarium where every fish is a process: size follows resident memory, speed follows CPU, and colour follows the process name."
assets = [
    ["target/release/procquarium", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/procquarium/README.md", "644"],
    ["procquarium.example.toml", "usr/share/doc/procquarium/config.toml.example", "644"],
    ["man/procquarium.1", "usr/share/man/man1/", "644"],
    ["completions/procquarium.bash", "usr/share/bash-completion/completions/procquarium", "644"],
    ["completions/_procquarium", "usr/share/zsh/vendor-completions/_procquarium", "644"],
    ["completions/procquarium.fish", "usr/share/fish/vendor_completions.d/procquarium.fish", "644"],
]

[workspace]
members = [".", "xtask"]
resolver = "3"
