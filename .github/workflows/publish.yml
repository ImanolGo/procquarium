name: Publish to crates.io

# Publishes the crate on a version tag, using crates.io Trusted Publishing:
# a GitHub OIDC token is exchanged for a short-lived crates.io token, so no
# long-lived CARGO_REGISTRY_TOKEN secret is needed.
#
# One-time setup on crates.io (required before this works):
#   https://crates.io/crates/procquarium/settings -> Trusted Publishing
#   add a GitHub publisher for repo "ImanolGo/procquarium" and workflow
#   "publish.yml" (an environment is optional).
#
# If you would rather use a token, delete the auth step and set the
# CARGO_REGISTRY_TOKEN repository secret instead.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: cargo publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
