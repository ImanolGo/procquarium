name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      # Make sure the crate still packages and would publish; catches a bad
      # include/exclude list before a release tag does.
      - name: cargo publish --dry-run
        if: matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run

      # The man page and completions are generated from the clap definition and
      # committed; fail if the committed copy is stale.
      - name: Check generated man page and completions
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -p xtask
          git diff --exit-code -- man completions

  msrv:
    name: msrv (1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2

      # Keep the declared rust-version honest: build against the pinned lockfile
      # with exactly the minimum supported toolchain.
      - name: Build at the declared MSRV
        run: cargo build --all-targets --locked
